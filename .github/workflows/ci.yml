name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  bootstrap:
    name: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Record runtime versions
        run: |
          node --version
          pnpm --version
          node --input-type=module -e "import fs from 'node:fs'; if(process.version.slice(1)!==fs.readFileSync('.node-version','utf8').trim()) process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm verify:bootstrap
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  quality:
    name: quality
    if: always()
    needs: [bootstrap]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every bootstrap check to succeed
        env:
          RESULT: ${{ needs.bootstrap.result }}
        run: test "$RESULT" = success
